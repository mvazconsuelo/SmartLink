# Application CI/CD.
#
#   pull request : tests + lint                    (nothing is published)
#   push to main : tests -> images -> D1 migrations -> GitOps commit
#   (or "Run workflow" on main, e.g. the first deploy)
#                  -> Argo CD (running inside K3s) pulls the change
#   tag vX.Y.Z   : the image already built for that commit is tagged X.Y.Z
#
# This workflow never talks to the Kubernetes API.
name: ci

on:
  pull_request:
    paths-ignore: &ignored
      - "deploy/**"
      - "scripts/**"
      - "docs/**"
      - "**.md"
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore: *ignored
  # Manual run on main: used for the first deploy of a new lab.
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend frontend
      - run: ruff format --check backend frontend
      - name: Unit tests (in-memory D1 fake with the real migrations)
        working-directory: backend
        run: pytest -q

  build:
    # Only commits on main produce deployable images.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: smartlink-api
            context: backend
          - image: smartlink-frontend
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Image reference
        id: ref
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR requires lowercase
          echo "image=${REGISTRY}/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          # amd64 for cloud runners/VMs, arm64 for a K3s VM on Apple Silicon.
          platforms: linux/amd64,linux/arm64
          push: true
          # The commit SHA is the deploy reference. Never "latest".
          tags: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  migrate:
    # Schema first, then the app that needs it (App v2 must never run on Schema v1).
    needs: build
    runs-on: ubuntu-24.04
    # One migration run at a time; migrations are additive, so they are safe
    # to apply before the new app version starts.
    concurrency:
      group: d1-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check Cloudflare credentials
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is empty. Add it in Settings › Secrets and variables › Actions › Secrets (Repository secrets)."; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Variable CLOUDFLARE_ACCOUNT_ID is empty. Add it in Settings › Secrets and variables › Actions › Variables."; exit 1; }
          status="$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.status // "invalid"')"
          [ "$status" = active ] || { echo "::error::Cloudflare rejects CLOUDFLARE_API_TOKEN (status: $status). It was rolled, mistyped or pasted with extra characters: update the secret."; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The database is created by scripts/03-d1.sh; look up its ID by name
      # instead of keeping a copy in wrangler.toml.
      - name: Resolve D1 database ID
        run: |
          id="$(npx --yes wrangler@4.147.0 d1 list --json | jq -r '.[] | select(.name == "smartlink") | .uuid')"
          [ -n "$id" ] || { echo "::error::D1 database 'smartlink' not found. Run scripts/03-d1.sh first."; exit 1; }
          sed -i "s/RESOLVED_BY_CI/$id/" wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Pending migrations
        run: npx --yes wrangler@4.147.0 d1 migrations list smartlink --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply migrations
        run: npx --yes wrangler@4.147.0 d1 migrations apply smartlink --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  gitops:
    # Deploy = change the desired state in Git. Argo CD does the rest.
    needs: migrate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: gitops-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Point the SmartLink charts at the new images
        # The registry path is derived from the repository owner, so a fork or
        # a copy of the repo deploys its own images without editing any file.
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR requires lowercase
          for pair in backend:smartlink-api frontend:smartlink-frontend; do
            ref="${REGISTRY}/${owner}/${pair##*:}" sha="${GITHUB_SHA::7}" \
              yq -i '.image.repository = strenv(ref) | .image.tag = strenv(sha)' \
              "deploy/components/smartlink-${pair%%:*}/values.yaml"
          done
          git diff
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/components/smartlink-backend/values.yaml deploy/components/smartlink-frontend/values.yaml
          git commit -m "deploy: smartlink ${GITHUB_SHA::7}" -m "Source commit: ${GITHUB_SHA}"
          # main may have moved while this pipeline ran.
          git pull --rebase origin main
          git push origin HEAD:main

  release:
    # A release does not rebuild: it labels the exact image that was tested
    # and deployed for that commit with a human-readable version.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag images with the release version
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          for image in smartlink-api smartlink-frontend; do
            ref="${REGISTRY}/${owner}/${image}"
            docker buildx imagetools create --tag "${ref}:${version}" "${ref}:${GITHUB_SHA::7}"
          done
