{{- /* Dashboard of the Traefik that ships with K3s, at http://traefik.<ip>.nip.io.
K3s enables the dashboard (--api.dashboard=true) but publishes no route to it: this is
that route. "api@internal" is Traefik's own service, so it lives in no namespace.
Toggled for every dashboard at once by uiRoutes.enabled in deploy/root/values.yaml
(turn it off on a VM exposed to the Internet). */ -}}
{{- if .Values.uiRoute }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ui
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints: [web]
  routes:
    - match: HostRegexp(`^traefik\..+`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
{{- end }}
